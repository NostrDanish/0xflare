services:
  relay:
    image: strfry/strfry:latest
    restart: unless-stopped
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
    expose:
      - "7777"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - relay
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"

  tor:
    image: goldy/tor-hidden-service:latest
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - ghost-onion:/var/lib/tor/hidden_service
    environment:
      RELAY_PORT: "80"
      RELAY_HOST: "nginx"

volumes:
  ghost-onion:
