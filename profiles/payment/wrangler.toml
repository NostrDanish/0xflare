name = "0xflare-payment"
compatibility_date = "2025-01-04"
main = "worker.js"

[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "0xflare-payment"
database_id = "REPLACE_WITH_YOUR_D1_UUID"

[triggers]
crons = ["0 0 * * *"]

[limits]
cpu_ms = 300000

[observability.logs]
enabled = false

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayWebSocket"]
